<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="100%" height="100%">
  <defs>
    <style>
      .logo-bold { font-family: 'Inter', 'Hanken Grotesk', sans-serif; font-weight: 900; fill: #181c1e; }
      .logo-red { font-family: 'Inter', 'Hanken Grotesk', sans-serif; font-weight: 800; fill: #ba0013; letter-spacing: 0.15em; }
      .logo-sub { font-family: 'Inter', sans-serif; font-weight: 500; fill: #5f5e5e; font-size: 11px; }
    </style>
  </defs>

  <!-- Red Globe Symbol with Orbit Arrows -->
  <g transform="translate(48, 50) scale(0.65)">
    <!-- Shadow Arc -->
    <path d="M-60,35 C-75,10 -70,-25 -45,-50 C-20,-75 20,-75 45,-50 C70,-25 75,10 60,35 C45,60 5,75 -30,70 C-50,65 -58,50 -60,35 Z" fill="#93000d" />
    <!-- Main Red Sphere -->
    <circle cx="0" cy="0" r="62" fill="#ba0013" />
    
    <!-- Top White Arrow Curve -->
    <path d="M-52,-20 C-38,-45 -10,-60 20,-55 C12,-48 0,-38 -15,-28 L-22,-45 L-40,-15 L-10,-10 L-20,-24 Z" fill="#ffffff" />
    <path d="M-42,-18 C-25,-38 10,-52 45,-38 C25,-30 0,-18 -22,-5 Z" fill="#ffffff" />
    
    <!-- Bottom White Arrow Curve -->
    <path d="M52,20 C38,45 10,60 -20,55 C-12,48 0,38 15,28 L22,45 L40,15 L10,10 L20,24 Z" fill="#ffffff" />
    <path d="M42,18 C25,38 -10,52 -45,38 C-25,30 0,18 22,5 Z" fill="#ffffff" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(105, 0)">
    <text x="0" y="42" class="logo-bold" font-size="32">AS BERJAYA</text>
    <text x="0" y="66" class="logo-red" font-size="14">LOGISTIC SERVICES</text>
    <text x="0" y="84" class="logo-sub">We are connecting the world</text>
  </g>
</svg>
